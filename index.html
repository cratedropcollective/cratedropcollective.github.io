<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crate Drop Collective | Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glow-blue:hover { box-shadow: 0 0 20px rgba(37, 99, 235, 0.2); }
    </style>
</head>
<body class="bg-[#f9fafb] text-slate-900 font-sans min-h-screen flex flex-col">

    <nav class="p-6">
        <div class="container mx-auto flex justify-center">
            <div class="flex flex-col items-center">
                <span class="text-3xl md:text-4xl font-black tracking-tighter leading-none italic">CRATE DROP</span>
                <span class="text-xs font-bold text-blue-600 tracking-[0.4em] uppercase ml-1">Collective</span>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center p-4 md:p-8">
        <div class="max-w-5xl w-full">
            
            <div class="text-center mb-12">
                <h2 class="text-slate-400 font-black uppercase text-[10px] md:text-xs tracking-[0.3em] mb-2">Choose your destination</h2>
                <div class="h-1 w-12 bg-blue-600 mx-auto rounded-full"></div>
            </div>

            <div class="grid md:grid-cols-2 gap-8">
                
                <a href="/preorder" class="group relative overflow-hidden bg-black rounded-3xl p-8 md:p-12 transition-all duration-500 hover:scale-[1.02] active:scale-95 shadow-2xl flex flex-col justify-between min-h-[350px]">
                    <div class="absolute -right-8 -top-8 text-white/5 text-9xl font-black italic select-none group-hover:text-blue-600/10 transition-colors">PRE</div>
                    
                    <div class="relative z-10">
                        <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center mb-6 transform group-hover:rotate-12 transition-transform">
                            <i class="fas fa-clock text-white text-2xl"></i>
                        </div>
                        <h3 class="text-3xl font-black text-white uppercase tracking-tighter mb-4">
                            Pre-Order <br><span class="text-blue-500">Drops</span>
                        </h3>
                        <p class="text-gray-400 text-sm font-medium leading-relaxed max-w-[240px]">
                            Secure upcoming releases and exclusive sets before they hit the shelves.
                        </p>
                    </div>

                    <div class="relative z-10 mt-8 flex items-center text-white text-xs font-black uppercase tracking-widest">
                        Enter Shop <i class="fas fa-arrow-right ml-2 group-hover:translate-x-2 transition-transform"></i>
                    </div>
                </a>

                <a href="/products" class="group relative overflow-hidden bg-white border border-gray-200 rounded-3xl p-8 md:p-12 transition-all duration-500 hover:scale-[1.02] active:scale-95 shadow-xl hover:shadow-2xl flex flex-col justify-between min-h-[350px]">
                    <div class="absolute -right-8 -top-8 text-slate-100 text-9xl font-black italic select-none group-hover:text-slate-200 transition-colors">LIVE</div>

                    <div class="relative z-10">
                        <div class="w-14 h-14 bg-slate-900 rounded-2xl flex items-center justify-center mb-6 transform group-hover:-rotate-12 transition-transform">
                            <i class="fas fa-box-open text-white text-2xl"></i>
                        </div>
                        <h3 class="text-3xl font-black text-slate-900 uppercase tracking-tighter mb-4">
                            On-Hand <br><span class="text-blue-600">Stock</span>
                        </h3>
                        <p class="text-slate-500 text-sm font-medium leading-relaxed max-w-[240px]">
                            Ready to ship immediately. Browse our current inventory of sealed products.
                        </p>
                    </div>

                    <div class="relative z-10 mt-8 flex items-center text-slate-900 text-xs font-black uppercase tracking-widest">
                        Enter Shop <i class="fas fa-arrow-right ml-2 group-hover:translate-x-2 transition-transform"></i>
                    </div>
                </a>

            </div>

            <div class="mt-16 text-center">
                <div class="flex justify-center space-x-6 mb-4 text-slate-400">
                    <a href="https://facebook.com/cratedropcollective" class="hover:text-blue-600 transition-colors"><i class="fab fa-facebook-messenger text-xl"></i></a>
                    <a href="#" class="hover:text-blue-600 transition-colors"><i class="fab fa-instagram text-xl"></i></a>
                </div>
                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-[0.2em]">© 2026 Crate Drop Collective</p>
            </div>
        </div>
    </main>

</body>
</html>
